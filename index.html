<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vayro Street · Painel</title>
<meta name="theme-color" content="#0f1012">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#0f1012; --card:#18191c; --card2:#202226; --line:#2c2e33;
  --txt:#f2f2ee; --mut:#a2a39e; --lime:#c8f53a; --lime-d:#a6d11c;
  --red:#ff6b5b; --blue:#6cc4ff; --amber:#ffc24a; --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45}
body{padding-bottom:84px}
h1,h2,h3,.disp{font-family:Archivo,Inter,sans-serif;letter-spacing:-.01em}
a{color:var(--lime)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 6px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--lime);color:#111;display:grid;place-items:center;font:900 18px Archivo}
.brand img{height:34px;width:auto;display:block}
.hero-logo{display:block;max-width:260px;width:70%;height:auto;margin:10px 0 12px}
.logos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.logos button{background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:14px 10px 10px;cursor:pointer;color:var(--mut);font:600 12px Inter;display:flex;flex-direction:column;align-items:center;gap:8px}
.logos button img{width:100%;max-width:150px;height:56px;object-fit:contain}
.logos button.on{border-color:var(--lime);color:var(--lime)}
.brand b{font:800 17px Archivo;display:block}
.brand small{color:var(--mut);font-size:12px}
.chip{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--card2);color:var(--mut);white-space:nowrap}
.chip.ok{color:var(--lime)} .chip.warn{color:var(--amber)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(15,16,18,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:760px;width:100%;overflow-x:auto;scrollbar-width:none}
nav.tabs .in::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 1 0;min-width:46px;background:none;border:0;color:var(--mut);padding:9px 0 10px;font:600 10px Inter;letter-spacing:-.01em;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button .ic{font-size:18px;line-height:1}
nav.tabs button.on{color:var(--lime)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:18px;margin-bottom:4px}
.card h3{font-size:15px;margin-bottom:8px}
.sub{color:var(--mut);font-size:13px}
.hero{background:linear-gradient(135deg,#1d2410 0%,#18191c 60%);border-color:#33401a}
.hero h1{font-size:25px;line-height:1.15;margin:4px 0 8px}
.hero .tag{color:var(--lime);font:700 12px Inter;text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:520px){.g3{grid-template-columns:1fr 1fr}.g3 .stat:last-child{grid-column:span 2}}
.stat{background:var(--card2);border-radius:12px;padding:12px}
.stat .l{font-size:12px;color:var(--mut)}
.stat .v{font:800 19px Archivo;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--lime)} .neg{color:var(--red)}
.bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .4s}
.bar.amber>i{background:var(--amber)} .bar.red>i{background:var(--red)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{background:var(--lime);color:#111;border:0;border-radius:12px;padding:12px 16px;font:700 14px Inter;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--txt)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn.danger{background:transparent;color:var(--red);padding:6px 8px}
label.f{display:block;font-size:12px;color:var(--mut);margin-bottom:10px}
label.f span{display:block;margin-bottom:4px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 12px;font:500 15px Inter;outline:none}
input:focus,select:focus{border-color:var(--lime)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px;border-radius:9px;font:700 13px Inter;cursor:pointer}
.seg button.on{background:var(--lime);color:#111}
.seg button.on.out{background:var(--red);color:#111}
/* etapas */
.fase{margin-bottom:14px}
.fase-h{display:flex;align-items:center;gap:12px;cursor:pointer}
.fase-n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 15px Archivo;background:var(--card2);flex:none}
.fase.done .fase-n{background:var(--lime);color:#111}
.fase-h .t{flex:1}
.fase-h .t b{font:800 16px Archivo;display:block}
.fase-h .t small{color:var(--mut);font-size:12px}
.passo{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.passo:first-of-type{margin-top:12px}
.ck{width:24px;height:24px;border-radius:7px;border:2px solid #55575d;flex:none;display:grid;place-items:center;cursor:pointer;margin-top:1px;background:none;color:#111;font-weight:900}
.passo.on .ck{background:var(--lime);border-color:var(--lime)}
.passo.on .pt{text-decoration:line-through;color:var(--mut)}
.pt{font-weight:600}
.pd{color:var(--mut);font-size:13px;margin-top:3px}
.pd b{color:var(--txt)}
.dica{background:#1d2410;border:1px solid #33401a;border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:14px}
.dica.warn{background:#2a2110;border-color:#4a3a14}
.dica b{color:var(--lime)} .dica.warn b{color:var(--amber)}
/* lançamentos */
.lanc{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.lanc .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:15px}
.lanc .dot.e{background:#26331a;color:var(--lime)} .lanc .dot.s{background:#3a1f1c;color:var(--red)}
.lanc .i{flex:1;min-width:0}
.lanc .i b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lanc .i small{color:var(--mut);font-size:12px}
.lanc .val{font:700 15px Archivo;white-space:nowrap}
.cat{margin-bottom:9px}
.cat .row{font-size:13px}
.cat .bar{height:7px;margin:4px 0 0}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:6px}
.chart .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.chart .bs{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.chart .bs i{width:42%;max-width:16px;border-radius:5px 5px 2px 2px;background:var(--lime);min-height:2px}
.chart .bs i.s{background:var(--red)}
.chart small{font-size:11px;color:var(--mut)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* preços */
.canal{background:var(--card2);border-radius:14px;padding:14px;margin-bottom:10px}
.canal .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.canal .hd b{font:800 16px Archivo}
.canal .preco{font:900 30px Archivo;color:var(--lime);line-height:1.1}
.canal .ln{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);padding:2px 0}
.canal .ln span:last-child{color:var(--txt)}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#26331a;color:var(--lime)}
.badge.o{background:#3b2410;color:#ffa45a} .badge.b{background:#122a3a;color:var(--blue)} .badge.r{background:#3a1f1c;color:var(--red)}
details.cfg summary{cursor:pointer;color:var(--lime);font-weight:600;font-size:14px;list-style:none}
details.cfg summary::-webkit-details-marker{display:none}
details.cfg[open] summary{margin-bottom:12px}
.prod{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.prod .sw{width:44px;height:44px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:20px;flex:none}
.prod .i{flex:1;min-width:0}
.prod .i b{display:block}
.prod .i small{color:var(--mut);font-size:12px}
.est{font:800 18px Archivo;text-align:right}
.est small{display:block;font:500 11px Inter;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:18px 6px;font-size:14px}
textarea{min-height:92px;resize:vertical;line-height:1.45}
.pq{padding:14px 0;border-top:1px solid var(--line)}
.pq:first-of-type{border-top:0;padding-top:4px}
.pq .q{font-weight:700;display:flex;gap:8px;align-items:flex-start}
.pq .q .ok{color:var(--lime);font-size:13px;flex:none;margin-top:2px}
.pq .h{color:var(--mut);font-size:13px;margin:3px 0 8px}
.big{font:900 26px Archivo;line-height:1.1}
.inv{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.inv input:first-child{flex:1}
.inv input.v{width:110px;flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl td,.tbl th{padding:8px 4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th{color:var(--mut);font-weight:600;font-size:12px;border-top:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;white-space:normal}
.tbl tr.tot td{font-weight:800;border-top:2px solid var(--line)}
.tbl tr.sub td{color:var(--mut)}
.var{font-size:11px;font-weight:700;padding:2px 6px;border-radius:99px;margin-left:6px}
.var.up{background:#26331a;color:var(--lime)} .var.dn{background:#3a1f1c;color:var(--red)}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:12px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:#c8f53a;flex:none}
.login{max-width:380px;margin:0 auto;padding:18vh 22px 40px;text-align:center}
.login img{width:220px;max-width:70%;height:auto;margin-bottom:6px}
.login form{text-align:left;margin-top:26px}
.cen{border-left:4px solid var(--line)}
.cen.best{border-left-color:var(--lime)}
.cen .nome{font:800 16px Archivo;background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:4px 0;margin-bottom:10px}
.item{background:var(--card2);border-radius:12px;padding:10px;margin-bottom:8px}
.item .r1{display:flex;gap:8px;align-items:center}
.item .r1 input{flex:1}
.item .r2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.item .r2 label{font-size:11px;color:var(--mut)}
.item .r2 input{margin-top:3px}
.item .ci{font-size:12px;color:var(--mut);margin-top:6px}
.item .ci b{color:var(--txt)}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.grade div{background:var(--card2);border-radius:10px;padding:8px 4px;text-align:center;font:800 16px Archivo}
.grade small{display:block;font:600 11px Inter;color:var(--mut)}
.gloss dt{font-weight:700;color:var(--lime);margin-top:10px}
.gloss dd{color:var(--mut);font-size:13.5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .sheet{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:760px;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--lime);color:#111;font-weight:700;padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.mt{margin-top:10px}.mb{margin-bottom:10px}
.small{font-size:12.5px;color:var(--mut)}
</style>
</head>

var SENHA_KEY = "vayro_senha", CACHE_KEY = "vayro_cache_v1";
var senha = null, versao = null, logado = false, usarAnon = false;
try{ senha = localStorage.getItem(SENHA_KEY); }catch(e){}
try{ var cc = JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); if(cc && cc.dados){ S = mesclar(PADRAO, cc.dados); versao = cc.versao; } }catch(e){}
function guardarCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify({dados:S, versao:versao})); }catch(e){} }
function rpc(fn, body){
  function chamar(anon){
    var h = {"Content-Type":"application/json", "apikey": anon?SB_ANON:SB_PUB};
    if(anon) h["Authorization"] = "Bearer "+SB_ANON;
    return fetch(SB_URL+"/rest/v1/rpc/"+fn, {method:"POST", headers:h, body:JSON.stringify(body)});
  }
  return chamar(usarAnon).then(function(r){
    if((r.status===401||r.status===403) && !usarAnon){ usarAnon=true; return chamar(true); }
    return r;
  }).then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); });
}
function sair(msg){
  try{ localStorage.removeItem(SENHA_KEY); localStorage.removeItem(CACHE_KEY); }catch(e){}
  senha=null; logado=false; versao=null; S=mesclar(PADRAO,{}); telaLogin(msg||"");
}
function telaLogin(msg, carregando){
  var app=document.getElementById("app");
  app.innerHTML='<div class="login"><img src="'+LOGOS.a+'" alt="Vayro Street"><div class="sub">Painel do MEI</div>'+
   (carregando?'<div class="small mt">Carregando…</div>':
   '<form id="fLogin"><label class="f"><span>Senha do painel</span><input type="password" name="senha" autocomplete="current-password" placeholder="Digite a senha" required></label>'+
   (msg?'<div class="small" style="color:var(--red);margin-bottom:10px">'+esc(msg)+'</div>':'')+
   '<button class="btn full" type="submit">Entrar</button><div class="small mt">A senha fica lembrada neste aparelho. Cada sócio usa a mesma senha.</div></form>')+'</div>';
}
function entrar(s, silencioso){
  return rpc("vayro_get", {p_senha:s}).then(function(r){
    if(!r || !r.ok){ if(silencioso) sair("A senha mudou. Entre com a nova senha."); else telaLogin("Senha incorreta. Confira e tente de novo."); return; }
    senha=s; try{ localStorage.setItem(SENHA_KEY, s); }catch(e){}
    S = mesclar(PADRAO, r.dados||{}); versao = r.versao; guardarCache();
    if(S.marca==="Minha Marca Fit") S.marca="Vayro Street";
    logado=true; statusSalvo="ok"; render();
  }).catch(function(){
    if(silencioso && senha){ logado=true; statusSalvo="off"; render(); }
    else telaLogin("Sem conexão com a internet. Tente de novo.");
  });
}
var salvarTimer=null, statusSalvo="ok", enviando=false, pendente=false;
function salvar(){
  S.atualizado = Date.now();
  guardarCache();
  statusSalvo="pend"; atualizaChip();
  clearTimeout(salvarTimer);
  salvarTimer = setTimeout(enviar, 1000);
}
function unirPorId(a, b){ var m={}, out=[]; (a||[]).forEach(function(x){ if(x&&x.id){ m[x.id]=x; } }); (b||[]).forEach(function(x){ if(x&&x.id) m[x.id]=x; }); Object.keys(m).forEach(function(k){ out.push(m[k]); }); return out; }
function enviar(){
  if(!senha) return;
  if(enviando){ pendente=true; return; }
  enviando=true; pendente=false;
  rpc("vayro_set", {p_senha:senha, p_dados:S, p_versao:versao}).then(function(r){
    enviando=false;
    if(r.ok){ versao=r.versao; guardarCache(); statusSalvo="ok"; atualizaChip(); if(pendente) enviar(); return; }
    if(r.erro==="senha"){ sair("A senha do painel foi trocada. Entre com a nova senha."); return; }
    if(r.erro==="conflito"){
      var srv = mesclar(PADRAO, r.dados||{});
      S.lancamentos = unirPorId(srv.lancamentos, S.lancamentos);
      S.produtos = unirPorId(srv.produtos, S.produtos);
      Object.keys(srv.etapas||{}).forEach(function(k){ if(srv.etapas[k] && S.etapas[k]===undefined) S.etapas[k]=true; });
      versao = r.versao; guardarCache(); render();
      toast("Juntei com o que o outro sócio salvou ✔");
      enviar(); return;
    }
    statusSalvo="off"; atualizaChip();
  }).catch(function(){
    enviando=false; statusSalvo="off"; atualizaChip();
    clearTimeout(salvarTimer); salvarTimer=setTimeout(enviar, 15000);
  });
}
function buscarNovidades(){
  if(!logado || !senha || enviando || statusSalvo==="pend" || modalHtml) return;
  var foco=document.activeElement; if(foco && /INPUT|TEXTAREA|SELECT/.test(foco.tagName)) return;
  rpc("vayro_get", {p_senha:senha}).then(function(r){
    if(!r || !r.ok){ if(r && r.erro==="senha") sair("A senha do painel foi trocada. Entre com a nova senha."); return; }
    if(statusSalvo==="off"){ enviar(); return; }
    if(r.versao!==versao && statusSalvo!=="pend" && !enviando){ S=mesclar(PADRAO, r.dados||{}); versao=r.versao; guardarCache(); render(); }
  }).catch(function(){});
}
setInterval(function(){ if(!document.hidden) buscarNovidades(); }, 20000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) buscarNovidades(); });
function atualizaChip(){
  var c = document.getElementById("chipSalvo"); if(!c) return;
  var m = {ok:["✓ Salvo na nuvem","chip ok"], pend:["Salvando…","chip"], off:["Sem internet · salvo no aparelho","chip warn"]}[statusSalvo] || ["","chip"];
  c.textContent=m[0]; c.className=m[1];
}

var fmt = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
function R(v){ return fmt.format(isFinite(v)?v:0); }
function num(v){ var s=String(v==null?"":v).trim(); if(s.indexOf(",")>-1) s=s.replace(/\./g,"").replace(",","."); var n=parseFloat(s); return isFinite(n)?n:0; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function hoje(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function mesAtual(){ return hoje().slice(0,7); }
var MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function nomeMes(am){ var p=am.split("-"); return MESES[+p[1]-1]+"/"+p[0].slice(2); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function toast(t){ var d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(function(){d.remove();},2200); }

/* ---------- cálculos ---------- */
function taxa(canal, p){
  var t=S.taxas;
  if(canal==="shopee"){
    var fx=t.shopeeFaixas.slice().sort(function(a,b){return b.min-a.min;}).find(function(f){return p>=f.min;}) || t.shopeeFaixas[0];
    return p*num(fx.pct)/100 + num(fx.fixa);
  }
  if(canal==="shein") return p*num(t.sheinPct)/100 + num(t.sheinLog);
  return p*num(t.diretaPct)/100 + num(t.diretaFixa);
}
function custoPeca(){
  var c=S.calc;
  return num(c.camiseta)+num(c.estampa)+num(c.embalagem)+num(c.outros)+ num(c.fixosMes)/Math.max(1,num(c.pecasMes));
}
function precoIdeal(canal, custo, margem){
  var m=margem/100;
  for(var cent=100; cent<=500000; cent++){
    var p=cent/100, l=p-taxa(canal,p)-custo;
    if(l>0 && l/p>=m) return p;
  }
  return null;
}
function arredonda90(p){ if(p==null) return null; var r=Math.floor(p)+0.9; if(r<p) r+=1; return r; }
function minimoSemPrejuizo(canal,custo){ return precoIdeal(canal,custo,0.0001); }

function doMes(am){ return S.lancamentos.filter(function(l){return (l.data||"").slice(0,7)===am;}); }
function soma(arr,tipo){ return arr.filter(function(l){return l.tipo===tipo;}).reduce(function(a,l){return a+num(l.valor);},0); }
function ehInvest(l){ return l.tipo==="s" && (l.categoria===CAT_INV || l.categoria==="Equipamentos"); }
function retorno(){
  var inv=0, op=0, porMes={};
  S.lancamentos.forEach(function(l){
    var v=num(l.valor), m=(l.data||"").slice(0,7);
    if(ehInvest(l)){ inv+=v; return; }
    var x = l.tipo==="e"?v:-v; op+=x; porMes[m]=(porMes[m]||0)+x;
  });
  var ms=Object.keys(porMes).sort().slice(-3), media= ms.length? ms.reduce(function(a,m){return a+porMes[m];},0)/ms.length : 0;
  var falta=Math.max(0,inv-Math.max(0,op));
  return {inv:inv, op:op, pct: inv>0? Math.max(0,Math.min(100,op/inv*100)) : 0, falta:falta, media:media, meses: (falta>0 && media>0)? Math.ceil(falta/media) : null};
}
function cardRetorno(compacto){
  var r=retorno();
  if(r.inv<=0) return compacto ? '' : '<div class="card"><h3>🏗️ Investimento inicial</h3><div class="small">Quando lançarem a prensa e outras compras do começo como <b style="color:var(--txt)">Saída → Investimento inicial</b>, aqui aparece quanto as vendas já pagaram desse investimento.</div></div>';
  var h='<div class="card"><div class="row"><h3 style="margin:0">🏗️ Retorno do investimento</h3>'+(compacto?'<button class="btn sm ghost" data-ir="dinheiro">Abrir</button>':'')+'</div>';
  h+='<div class="grid g2 mt"><div class="stat"><div class="l">Investido</div><div class="v">'+R(r.inv)+'</div></div><div class="stat"><div class="l">Já pago pelas vendas</div><div class="v '+(r.op>=0?"pos":"neg")+'">'+R(Math.max(0,Math.min(r.op,r.inv)))+'</div></div></div>';
  h+='<div class="row mt"><span class="small">Investimento recuperado</span><b class="pos">'+Math.round(r.pct)+'%</b></div><div class="bar"><i style="width:'+r.pct+'%"></i></div>';
  if(r.pct>=100) h+='<div class="small">🏆 Investimento pago! A partir de agora, o que sobra é lucro de verdade.</div>';
  else if(r.meses) h+='<div class="small">Faltam '+R(r.falta)+'. No ritmo dos últimos meses ('+R(r.media)+'/mês), paga em uns <b style="color:var(--txt)">'+r.meses+' '+(r.meses>1?"meses":"mês")+'</b>. Bora vender! 🚀</div>';
  else h+='<div class="small">Faltam '+R(r.falta)+'. Assim que as vendas passarem os custos do mês, aparece aqui a previsão de quando o investimento se paga.</div>';
  if(!compacto) h+='<div class="small mt">Conta como investimento: “Investimento inicial” e “Equipamentos”. O lucro das vendas é tudo que entrou menos as outras saídas.</div>';
  return h+'</div>';
}
function limiteAno(){
  var ano=new Date().getFullYear();
  if(S.abertura && +S.abertura.slice(0,4)===ano){ var mesAb=+S.abertura.slice(5,7); return 6750*(12-mesAb+1); }
  return 81000;
}

function nivelPlano(){ var t=S.plano.textos||{}; return PERGUNTAS.filter(function(q){return (t[q.k]||"").trim().length>=10;}).length; }
function contasPlano(){
  var P=S.plano, c=S.calc, preco=num(P.preco), pecas=Math.max(0,num(P.pecasMes));
  var mixT = num(P.mix.shopee)+num(P.mix.shein)+num(P.mix.direta) || 1;
  var taxaMedia = CANAIS.reduce(function(a,cn){ return a + taxa(cn.id,preco)*num(P.mix[cn.id])/mixT; },0);
  var custoVar = num(c.camiseta)+num(c.estampa)+num(c.embalagem)+num(c.outros);
  var fixos = num(c.fixosMes);
  var lucroPeca = preco - taxaMedia - custoVar;
  var fatMes = pecas*preco, lucroMes = pecas*lucroPeca - fixos;
  var invItens = (P.inv||[]).reduce(function(a,i){return a+num(i.valor);},0), invTotal = invItens + num(P.reserva);
  return {preco:preco,pecas:pecas,mixT:mixT,taxaMedia:taxaMedia,custoVar:custoVar,fixos:fixos,lucroPeca:lucroPeca,fatMes:fatMes,fatAno:fatMes*12,lucroMes:lucroMes,
    equilibrio: lucroPeca>0 ? Math.ceil(fixos/lucroPeca) : null,
    invItens:invItens, invTotal:invTotal, payback: lucroMes>0 ? Math.ceil(invTotal/lucroMes) : null,
    maxPecasMei: preco>0 ? Math.floor(6750/preco) : 0};
}

function temNF(l){ return l.nf!==undefined ? !!l.nf : l.categoria!=="Venda direta / Instagram"; }
var GRUPOS = [
 {n:"Custo dos produtos", cats:["Camisetas lisas","Estampa / insumos (DTF, tinta)","Embalagem e etiquetas"]},
 {n:"Taxas das plataformas", cats:["Taxas de plataforma"]},
 {n:"Frete / envio", cats:["Frete / envio"]},
 {n:"Despesas do mês", cats:["DAS (imposto do MEI)","Anúncios / marketing","Outras saídas"]}
];
var CAT_RET="Retirada dos sócios (pró-labore)";
function resumoMes(am){
  var l=doMes(am), r={vendas:0, outrasE:0, grupos:{}, inv:0, ret:0, nfCom:0, nfSem:0, canais:{}, prods:{}, pecas:0};
  GRUPOS.forEach(function(g){r.grupos[g.n]=0;});
  l.forEach(function(x){
    var v=num(x.valor);
    if(x.tipo==="e"){
      if(x.categoria==="Outras entradas"){ r.outrasE+=v; return; }
      r.vendas+=v; if(temNF(x)) r.nfCom+=v; else r.nfSem+=v;
      r.canais[x.categoria]=(r.canais[x.categoria]||0)+v;
      var q=x.qtd, nome=null;
      var m=(x.desc||"").match(/^(\d+)\s*[×x]\s*(.+)$/);
      if(m){ q=q||+m[1]; nome=m[2].trim(); }
      if(x.prod){ var pp=S.produtos.find(function(p){return p.id===x.prod;}); if(pp) nome=pp.nome; }
      if(q){ r.pecas+=q; if(nome){ if(!r.prods[nome]) r.prods[nome]={q:0,v:0}; r.prods[nome].q+=q; r.prods[nome].v+=v; } }
      return;
    }
    if(ehInvest(x)){ r.inv+=v; return; }
    if(x.categoria===CAT_RET){ r.ret+=v; return; }
    var g=GRUPOS.find(function(g){return g.cats.indexOf(x.categoria)>-1;}) || GRUPOS[3];
    r.grupos[g.n]+=v;
  });
  r.custos=GRUPOS.reduce(function(a,g){return a+r.grupos[g.n];},0);
  r.lucro=r.vendas+r.outrasE-r.custos;
  r.margem=r.vendas>0? r.lucro/r.vendas*100 : 0;
  r.n=l.length;
  return r;
}

/* ---------- simulação de compra ---------- */
function cenarios(){ if(!S.compra||!Array.isArray(S.compra.cenarios)) S.compra={cenarios:[]}; return S.compra.cenarios; }
function contaCenario(c){
  var itens=(c.itens||[]), pecas=0, sub=0;
  itens.forEach(function(i){ var q=Math.max(0,Math.round(num(i.qtd))); pecas+=q; sub+=q*num(i.preco); });
  var descPct=Math.min(100,Math.max(0,num(c.descPct))), descA=sub*descPct/100, descB=Math.min(Math.max(0,num(c.descExtra)), sub-descA), desc=descA+descB, liq=sub-desc;
  var fg=num(c.freteGratis), frete = (fg>0 && liq>=fg) ? 0 : num(c.frete);
  var total=liq+frete, fretePeca = pecas? frete/pecas : 0, medio = pecas? total/pecas : 0;
  var k=contasPlano(), extras=num(S.calc.estampa)+num(S.calc.embalagem)+num(S.calc.outros);
  var base={fatorDesc: sub>0? liq/sub:1, fretePeca:fretePeca, extras:extras}, lt=0, liqTot=0;
  itens.forEach(function(i){ var ic=itemConta(i,base); lt+=ic.lucro*ic.q; liqTot+=ic.liq*ic.q; });
  var lucroPeca = pecas? lt/pecas : 0, liqMedio = pecas? liqTot/pecas : 0;
  return {pecas:pecas, sub:sub, descPct:descPct, descA:descA, descB:descB, desc:desc, liq:liq, fatorDesc: sub>0? liq/sub : 1, frete:frete, freteGratis: fg>0 && liq>=fg, total:total, fretePeca:fretePeca, medio:medio, extras:extras, custoCompleto:medio+extras,
    lucroPeca:lucroPeca, lucroTotal:lt, precoVenda:k.preco, taxaMedia:k.taxaMedia,
    pagaEm: liqMedio>0 ? Math.ceil(total/liqMedio) : null,
    meses: num(S.plano.pecasMes)>0 ? pecas/num(S.plano.pecasMes) : null};
}
function taxaMediaEm(preco){ var P=S.plano, mixT=num(P.mix.shopee)+num(P.mix.shein)+num(P.mix.direta)||1; return CANAIS.reduce(function(a,cn){ return a + taxa(cn.id,preco)*num(P.mix[cn.id])/mixT; },0); }
function itemConta(i,k){ var q=Math.max(0,Math.round(num(i.qtd))), venda=num(i.venda)>0?num(i.venda):num(S.plano.preco), tx=taxaMediaEm(venda), custo=num(i.preco)*k.fatorDesc+k.fretePeca+k.extras; return {q:q, venda:venda, propria:num(i.venda)>0, taxa:tx, custo:custo, lucro:venda-tx-custo, liq:venda-tx}; }
function grade(q){ var pct=[["P",.15],["M",.35],["G",.35],["GG",.15]], r=pct.map(function(x){return [x[0],Math.floor(q*x[1])];}), soma=r.reduce(function(a,x){return a+x[1];},0), ord=[1,2,0,3], i=0; while(soma<q){ r[ord[i%4]][1]++; soma++; i++; } return r; }
function telaCompra(){
  var cs=cenarios();
  var h='<div class="card hero"><div class="tag">Simulação 🛒</div><h1>Compra inicial</h1><div class="sub">Monte um <b style="color:var(--txt)">cenário</b> pra cada opção (fornecedor ou quantidade diferente) e compare. Em cada cenário, coloquem uma linha por cor ou modelo. O frete é dividido sozinho entre as peças.</div></div>';
  h+='<div id="cmpResumo"></div>';
  cs.forEach(function(c){
    h+='<div class="card cen" data-cen="'+c.id+'"><input class="nome" data-cf="'+c.id+'" data-k="nome" value="'+esc(c.nome)+'" placeholder="Nome do cenário (ex.: Fornecedor B · 80 peças)">';
    (c.itens||[]).forEach(function(i){
      h+='<div class="item"><div class="r1"><input data-ci="'+c.id+'|'+i.id+'" data-k="desc" value="'+esc(i.desc)+'" placeholder="Cor / modelo (ex.: Branca dry fit)"><button class="btn danger" data-delitem="'+c.id+'|'+i.id+'" aria-label="Remover">✕</button></div>';
      h+='<div class="r2"><label>Qtd<input inputmode="numeric" data-ci="'+c.id+'|'+i.id+'" data-k="qtd" value="'+esc(i.qtd)+'"></label><label>Custo un. (R$)<input inputmode="decimal" data-ci="'+c.id+'|'+i.id+'" data-k="preco" value="'+esc(i.preco)+'"></label><label>Venda (R$)<input inputmode="decimal" data-ci="'+c.id+'|'+i.id+'" data-k="venda" value="'+esc(i.venda||"")+'" placeholder="'+esc(String(num(S.plano.preco)).replace(".",","))+'"></label></div>';
      h+='<div class="ci" id="ci_'+i.id+'"></div></div>';
    });
    h+='<button class="btn sm ghost mb" data-additem="'+c.id+'">+ Cor / modelo</button>';
    h+='<div class="grid g2"><label class="f"><span>Frete do pedido (R$)</span><input inputmode="decimal" data-cf="'+c.id+'" data-k="frete" value="'+esc(c.frete)+'"></label><label class="f"><span>Frete grátis acima de (R$)</span><input inputmode="decimal" data-cf="'+c.id+'" data-k="freteGratis" value="'+esc(c.freteGratis||"")+'" placeholder="se tiver"></label></div>';
    h+='<div class="grid g2"><label class="f"><span>Desconto da compra (%)</span><input inputmode="decimal" data-cf="'+c.id+'" data-k="descPct" value="'+esc(c.descPct||"")+'" placeholder="ex.: 10"></label><label class="f"><span>Desconto extra (R$)</span><input inputmode="decimal" data-cf="'+c.id+'" data-k="descExtra" value="'+esc(c.descExtra||"")+'" placeholder="cupom, Pix…"></label></div>';
    h+='<div id="cr_'+c.id+'"></div>';
    h+='<div class="grid g2 mt"><button class="btn sm ghost" data-dupcen="'+c.id+'">📄 Duplicar</button><button class="btn sm danger" data-delcen="'+c.id+'">Apagar cenário</button></div></div>';
  });
  h+='<button class="btn full mb" data-addcen>+ Novo cenário</button>';
  h+='<div class="dica"><b>Dica:</b> pra ver se vale comprar mais, use <b>📄 Duplicar</b> e mude só a quantidade e o preço da faixa de desconto. A comparação lá em cima mostra na hora qual compensa.</div>';
  h+='<div class="dica warn"><b>Camiseta branca:</b> sai mais barata e o DTF fica lindo nela, mas pra academia marca suor e suja mais fácil. Muitas marcas começam com uma mistura (ex.: 60% preta e 40% branca) pra testar o que vende mais.</div>';
  h+='<div class="small mb">O lucro previsto usa o preço médio de venda e os canais da aba <b>Plano</b>, e o custo de estampa, embalagem e outros da aba <b>Preços</b>. É só uma simulação: nada aqui entra no Dinheiro nem no estoque.</div>';
  return h;
}
function recalcCompra(){
  var cs=cenarios(), box=document.getElementById("cmpResumo"); if(!box) return;
  var rs=cs.map(function(c){ return {c:c, k:contaCenario(c)}; }).filter(function(x){return x.k.pecas>0;});
  var melhor = rs.slice().sort(function(a,b){return a.k.medio-b.k.medio;})[0];
  var h='';
  if(rs.length){
    h+='<div class="card"><h3>⚖️ Comparação</h3><table class="tbl"><tr><th>Cenário</th><th>Peças</th><th>Total</th><th>Por peça</th></tr>';
    rs.slice().sort(function(a,b){return a.k.medio-b.k.medio;}).forEach(function(x){
      h+='<tr><td>'+(x===melhor?'🏆 ':'')+esc(x.c.nome||"Sem nome")+'</td><td>'+x.k.pecas+'</td><td>'+R(x.k.total)+'</td><td class="'+(x===melhor?"pos":"")+'"><b>'+R(x.k.medio)+'</b></td></tr>';
    });
    h+='</table>';
    if(rs.length>1){
      var caro=rs.slice().sort(function(a,b){return b.k.medio-a.k.medio;})[0];
      var eco=(caro.k.medio-melhor.k.medio);
      h+='<div class="small mt">O cenário 🏆 sai <b class="pos">'+R(eco)+' mais barato por peça</b> que o mais caro. Em '+melhor.k.pecas+' peças, isso dá '+R(eco*melhor.k.pecas)+' de economia, mas o pedido total fica em '+R(melhor.k.total)+'. Vejam se cabe no caixa e se vocês vendem essa quantidade em uns 2 meses.</div>';
    }
    h+='<div class="small mt">“Por peça” = camiseta com desconto + frete dividido. Ainda não inclui estampa e embalagem (essa conta aparece em cada cenário).</div></div>';
  }
  box.innerHTML=h;
  cs.forEach(function(c){
    var k=contaCenario(c), el=document.getElementById("cr_"+c.id);
    var card=document.querySelector('[data-cen="'+c.id+'"]'); if(card) card.classList.toggle("best", !!(melhor && melhor.c===c && rs.length>1));
    (c.itens||[]).forEach(function(i){ var ci=document.getElementById("ci_"+i.id); if(ci){ var q=Math.round(num(i.qtd)); var ic=itemConta(i,k); ci.innerHTML = q>0 ? (k.desc>0?'Com desconto e frete: ':'Com frete: ')+'<b>'+R(num(i.preco)*k.fatorDesc+k.fretePeca)+'</b> por peça · '+R(q*num(i.preco)*k.fatorDesc)+' no total<br>Vendendo a '+R(ic.venda)+(ic.propria?'':' (preço médio do Plano)')+': lucro de <b class="'+(ic.lucro>=0?"pos":"neg")+'">'+R(ic.lucro)+'</b> por peça ('+(ic.venda>0?Math.round(ic.lucro/ic.venda*100):0)+'%) · '+R(ic.lucro*q)+' se vender todas' : 'Coloque a quantidade'; } });
    if(!el) return;
    if(!k.pecas){ el.innerHTML='<div class="small">Coloque quantidade e preço pra ver as contas.</div>'; return; }
    var e='<div class="canal"><div class="ln"><span>Camisetas ('+k.pecas+' peças)</span><span>'+R(k.sub)+'</span></div>';
    if(k.descA>0) e+='<div class="ln"><span>(−) Desconto da compra ('+String(k.descPct).replace(".",",")+'%)</span><span class="pos">−'+R(k.descA)+'</span></div>';
    if(k.descB>0) e+='<div class="ln"><span>(−) Desconto extra</span><span class="pos">−'+R(k.descB)+'</span></div>';
    e+='<div class="ln"><span>Frete'+(k.freteGratis?' <span class="badge">grátis!</span>':'')+'</span><span>'+R(k.frete)+'</span></div>';
    e+='<div class="ln"><span><b style="color:var(--txt)">Total do pedido</b></span><span><b>'+R(k.total)+'</b></span></div>';
    e+='<div class="ln"><span>Camiseta + frete, por peça</span><span><b class="pos">'+R(k.medio)+'</b></span></div>';
    e+='<div class="ln"><span>+ estampa, embalagem e outros</span><span>'+R(k.extras)+'</span></div>';
    e+='<div class="ln"><span><b style="color:var(--txt)">Custo completo por peça</b></span><span><b>'+R(k.custoCompleto)+'</b></span></div></div>';
    e+='<div class="grid g2 mt"><div class="stat"><div class="l">Lucro médio por peça*</div><div class="v '+(k.lucroPeca>=0?"pos":"neg")+'">'+R(k.lucroPeca)+'</div></div><div class="stat"><div class="l">Se vender tudo*</div><div class="v '+(k.lucroTotal>=0?"pos":"neg")+'">'+R(k.lucroTotal)+'</div></div></div>';
    var fn=num(c.freteGratis);
    if(k.desc>0) e+='<div class="dica mt" style="margin-bottom:0">💸 Os descontos economizaram <b>'+R(k.desc)+'</b> nesse pedido ('+R(k.desc/k.pecas)+' por peça).</div>';
    if(fn>0 && !k.freteGratis) e+='<div class="dica warn mt" style="margin-bottom:0">Faltam <b>'+R(fn-k.liq)+'</b> em camisetas pra ganhar o frete grátis (economia de '+R(num(c.frete))+').</div>';
    e+='<div class="small mt">* Usando o preço de venda de cada camiseta (ou o preço médio da aba Plano, '+R(k.precoVenda)+', onde ficou em branco), já tirando as taxas das plataformas e o custo de estampa e embalagem.';
    if(k.pagaEm) e+=' O pedido se paga com as primeiras <b style="color:var(--txt)">'+k.pagaEm+' vendas</b>.';
    if(k.meses) e+=' Na meta de '+num(S.plano.pecasMes)+' peças/mês, esse estoque dura '+(k.meses<1?'<b style="color:var(--txt)">menos de 1 mês</b>':'uns <b style="color:var(--txt)">'+k.meses.toFixed(1).replace(".",",")+' meses</b>')+'.';
    e+='</div>';
    e+='<div class="small mt" style="color:var(--txt);font-weight:600">Grade de tamanhos sugerida (por cor)</div>';
    (c.itens||[]).forEach(function(i){ var q=Math.round(num(i.qtd)); if(q<=0) return;
      e+='<div class="small mt">'+esc(i.desc||"Sem nome")+' · '+q+' peças</div><div class="grade">'+grade(q).map(function(g){return '<div>'+g[1]+'<small>'+g[0]+'</small></div>';}).join("")+'</div>'; });
    el.innerHTML=e;
  });
}

/* ---------- render ---------- */
function render(){
  if(!logado) return;
  var app=document.getElementById("app");
  var corpo = aba==="compra"?telaCompra():aba==="relatorio"?telaRelatorio():aba==="plano"?telaPlano():aba==="etapas"?telaEtapas():aba==="dinheiro"?telaDinheiro():aba==="precos"?telaPrecos():aba==="produtos"?telaProdutos():telaInicio();
  app.innerHTML = '<header class="top"><div class="brand">'+(LOGOS[S.logo]?'<img src="'+LOGOS[S.logo]+'" alt="'+esc(S.marca)+'">':'<div class="logo">'+esc((S.marca||"M").trim().charAt(0).toUpperCase())+'</div><div><b>'+esc(S.marca)+'</b><small>Painel do MEI</small></div>')+'</div><span id="chipSalvo" class="chip"></span></header>'+
    '<main class="wrap">'+corpo+'</main>'+
    '<nav class="tabs"><div class="in">'+ABAS.map(function(a){return '<button data-ir="'+a[0]+'" class="'+(aba===a[0]?"on":"")+'"><span class="ic">'+a[1]+'</span>'+a[2]+'</button>';}).join("")+'</div></nav>';
  atualizaChip();
  if(aba==="precos") resultadosPreco();
  if(aba==="plano") resultadosPlano();
  if(aba==="compra") recalcCompra();
}

/* ---------- eventos ---------- */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-additem],[data-delitem],[data-addcen],[data-dupcen],[data-delcen],[data-sair],[data-logo],[data-copiarel],[data-addinv],[data-delinv],[data-copiaplano],[data-ir],[data-ck],[data-fase],[data-tipo],[data-del],[data-das],[data-csv],[data-salvaprod],[data-novoprod],[data-editprod],[data-delprod],[data-est],[data-venda],[data-fechar]");
  if(!t) return;
  var d=t.dataset;
  if(d.additem){ var cA=cenarios().find(function(c){return c.id===d.additem;}); if(cA){ cA.itens.push({id:uid(),desc:"",qtd:"",preco:""}); salvar(); render(); } return; }
  if(d.delitem){ var pr2=d.delitem.split("|"), cD=cenarios().find(function(c){return c.id===pr2[0];}); if(cD){ cD.itens=cD.itens.filter(function(i){return i.id!==pr2[1];}); salvar(); render(); } return; }
  if(d.addcen!==undefined){ cenarios().push({id:uid(),nome:"Fornecedor "+String.fromCharCode(65+cenarios().length%26),frete:0,freteGratis:0,itens:[{id:uid(),desc:"Branca",qtd:"",preco:""},{id:uid(),desc:"Preta",qtd:"",preco:""}]}); salvar(); render(); window.scrollTo(0,document.body.scrollHeight); return; }
  if(d.dupcen){ var cO=cenarios().find(function(c){return c.id===d.dupcen;}); if(cO){ var nc=JSON.parse(JSON.stringify(cO)); nc.id=uid(); nc.nome=(cO.nome||"Cenário")+" (cópia)"; nc.itens.forEach(function(i){i.id=uid();}); var ix=cenarios().indexOf(cO); cenarios().splice(ix+1,0,nc); salvar(); render(); toast("Cenário duplicado 📄"); } return; }
  if(d.delcen){ S.compra.cenarios=cenarios().filter(function(c){return c.id!==d.delcen;}); salvar(); render(); toast("Cenário apagado"); return; }
  if(d.sair!==undefined){ sair(""); return; }
  if(d.logo){ S.logo=d.logo; salvar(); render(); var c=document.querySelector("details.cfg"); if(c) c.open=true; toast("Logo trocado! ✨"); return; }
  if(d.copiarel!==undefined){ try{ navigator.clipboard.writeText(textoRelatorio()).then(function(){toast("Relatório copiado! 📊");},function(){toast("Não consegui copiar 😕");}); }catch(e){ toast("Não consegui copiar 😕"); } return; }
  if(d.addinv!==undefined){ S.plano.inv.push({id:uid(),nome:"",valor:0}); salvar(); render(); var ins=document.querySelectorAll('[data-campo="nome"]'); if(ins.length) ins[ins.length-1].focus(); return; }
  if(d.delinv){ S.plano.inv=S.plano.inv.filter(function(i){return i.id!==d.delinv;}); salvar(); render(); return; }
  if(d.copiaplano!==undefined){ try{ navigator.clipboard.writeText(textoPlano()).then(function(){toast("Plano copiado! 📋");},function(){toast("Não consegui copiar 😕");}); }catch(e){ toast("Não consegui copiar 😕"); } return; }
  if(d.ir){ irPara(d.ir); return; }
  if(d.ck){ S.etapas[d.ck]=!S.etapas[d.ck]; if(S.etapas[d.ck]) toast(["Mandou bem! 💪","Mais um! 🔥","Isso aí! 🚀","Show! ✅"][Math.floor(Math.random()*4)]); salvar(); render(); return; }
  if(d.fase!==undefined){ var fi=+d.fase; var aberta=document.querySelector('[data-fase="'+fi+'"]').parentNode.querySelector(".passo"); faseAberta = aberta? -1 : fi; render(); return; }
  if(d.tipo){ novoTipo=d.tipo; render(); return; }
  if(d.del){ S.lancamentos=S.lancamentos.filter(function(l){return l.id!==d.del;}); salvar(); render(); toast("Lançamento apagado"); return; }
  if(d.das!==undefined){ S.lancamentos.push({id:uid(),tipo:"s",data:hoje(),categoria:"DAS (imposto do MEI)",desc:"DAS "+nomeMes(mesAtual()),valor:num(S.dasValor)}); S.etapas.r_das=true; salvar(); render(); toast("DAS lançado ✅"); return; }
  if(d.csv!==undefined){
    var linhas=[["Data","Tipo","Categoria","Descrição","Valor"]].concat(S.lancamentos.slice().sort(function(a,b){return (a.data||"").localeCompare(b.data||"");}).map(function(l){return [l.data,l.tipo==="e"?"Entrada":"Saída",l.categoria,(l.desc||"").replace(/\t/g," "),num(l.valor).toFixed(2).replace(".",",")];}));
    var txt=linhas.map(function(r){return r.join("\t");}).join("\n");
    try{ navigator.clipboard.writeText(txt).then(function(){toast("Copiado! Cole no Excel ou Google Planilhas");},function(){toast("Não consegui copiar 😕");}); }catch(e){ toast("Não consegui copiar 😕"); }
    return;
  }
  if(d.salvaprod){ var p={id:"",nome:"",modelo:"Algodão",custo:custoPeca().toFixed(2),pShopee:arredonda90(precoIdeal("shopee",custoPeca(),num(S.calc.margem)))||"",pShein:arredonda90(precoIdeal("shein",custoPeca(),num(S.calc.margem)))||"",pDireta:arredonda90(precoIdeal("direta",custoPeca(),num(S.calc.margem)))||"",estoque:0};
    ["pShopee","pShein","pDireta"].forEach(function(k){ if(p[k]) p[k]=(+p[k]).toFixed(2); });
    abrirModal(formProduto(p)); return; }
  if(d.novoprod!==undefined){ abrirModal(formProduto()); return; }
  if(d.editprod){ abrirModal(formProduto(S.produtos.find(function(p){return p.id===d.editprod;}))); return; }
  if(d.delprod){ S.produtos=S.produtos.filter(function(p){return p.id!==d.delprod;}); salvar(); fecharModal(); render(); toast("Produto apagado"); return; }
  if(d.est){ var pr=S.produtos.find(function(p){return p.id===d.est;}); if(pr){ pr.estoque=Math.max(0,num(pr.estoque)+(+d.d)); salvar(); render(); } return; }
  if(d.venda!==undefined){ if(S.produtos.length) abrirModal(formVenda()); return; }
  if(d.fechar!==undefined){ fecharModal(); return; }
});
document.addEventListener("submit",function(ev){
  var f=ev.target; ev.preventDefault(); var fid=f.getAttribute("id");
  if(fid==="fLogin"){ var sv=f.senha.value.trim(); if(sv){ f.querySelector("button").textContent="Entrando…"; entrar(sv,false); } return; }
  if(fid==="fSenha"){
    var nova=f.nova.value.trim(); if(nova.length<10){ toast("Use pelo menos 10 caracteres"); return; }
    rpc("vayro_trocar_senha",{p_senha:senha,p_nova:nova}).then(function(r){ if(r.ok){ senha=nova; try{localStorage.setItem(SENHA_KEY,nova);}catch(e){} f.reset(); toast("Senha trocada! Avise o outro sócio 🔐"); } else toast(r.erro==="curta"?"Senha muito curta":"Não consegui trocar a senha"); }).catch(function(){ toast("Sem internet agora 😕"); });
    return;
  }
  if(fid==="fLanc"){
    var v=num(f.valor.value); if(v<=0){ toast("Coloque um valor maior que zero"); return; }
    var nl={id:uid(),tipo:novoTipo,data:f.data.value||hoje(),categoria:f.categoria.value,desc:f.desc.value.trim(),valor:v};
    if(novoTipo==="e") nl.nf=!!(f.nf&&f.nf.checked);
    S.lancamentos.push(nl);
    if(f.categoria.value==="DAS (imposto do MEI)") S.etapas.r_das=true;
    mesSel=(f.data.value||hoje()).slice(0,7);
    salvar(); render(); toast(novoTipo==="e"?"Entrada salva! 💰":"Saída salva!");
  }
  if(fid==="fProd"){
    var o={id:f.elements["id"].value||uid(),nome:f.nome.value.trim()||"Sem nome",modelo:f.modelo.value,custo:num(f.custo.value),pShopee:num(f.pShopee.value),pShein:num(f.pShein.value),pDireta:num(f.pDireta.value),estoque:Math.max(0,Math.round(num(f.estoque.value)))};
    var i=S.produtos.findIndex(function(p){return p.id===o.id;});
    if(i>=0) S.produtos[i]=o; else S.produtos.push(o);
    salvar(); fecharModal(); aba="produtos"; try{location.hash="produtos";}catch(e){} render(); toast("Produto salvo! 👕");
  }
  if(fid==="fVenda"){
    var prod=S.produtos.find(function(p){return p.id===f.prod.value;}); if(!prod) return;
    var q=Math.max(1,Math.round(num(f.qtd.value))), pr=num(f.preco.value), cn=CANAIS.find(function(c){return c.id===f.canal.value;}), dt=f.data.value||hoje();
    if(pr<=0){ toast("Coloque o preço da venda"); return; }
    S.lancamentos.push({id:uid(),tipo:"e",data:dt,categoria:cn.cat,desc:q+"× "+prod.nome,valor:+(pr*q).toFixed(2),qtd:q,prod:prod.id,nf:!!f.nf.checked});
    var tx=taxa(cn.id,pr)*q;
    if(tx>0) S.lancamentos.push({id:uid(),tipo:"s",data:dt,categoria:"Taxas de plataforma",desc:"Taxa "+cn.n+" · "+q+"× "+prod.nome,valor:+tx.toFixed(2),auto:true});
    prod.estoque=Math.max(0,num(prod.estoque)-q);
    if(!S.etapas.primeira){ S.etapas.primeira=true; }
    salvar(); fecharModal(); render(); toast("Venda registrada! 🎉");
  }
});
var calcTimer=null;
document.addEventListener("input",function(ev){
  var t=ev.target, d=t.dataset;
  if(d.calc){ S.calc[d.calc]=t.value; if(d.calc==="margem"){var ml=document.getElementById("mLbl"); if(ml) ml.textContent=t.value+"%";} resultadosPreco();
    guardarCache();
    clearTimeout(calcTimer); calcTimer=setTimeout(salvar, 4000); }
  if(d.cf){ var cX=cenarios().find(function(c){return c.id===d.cf;}); if(cX){ cX[d.k] = d.k==="nome"? t.value : num(t.value); recalcCompra(); } }
  if(d.ci){ var pp=d.ci.split("|"), cY=cenarios().find(function(c){return c.id===pp[0];}), iY=cY&&cY.itens.find(function(i){return i.id===pp[1];}); if(iY){ iY[d.k] = d.k==="desc"? t.value : num(t.value); recalcCompra(); } }
  if(d.pn){ S.plano[d.pn]=num(t.value); resultadosPlano(); }
  if(d.mix){ S.plano.mix[d.mix]=num(t.value); resultadosPlano(); }
  if(d.inv){ var it=S.plano.inv.find(function(i){return i.id===d.inv;}); if(it){ it[d.campo] = d.campo==="valor"?num(t.value):t.value; resultadosPlano(); } }
  if(d.tx){
    var m=d.tx.match(/^sf(\d)(pct|fixa)$/);
    if(m) S.taxas.shopeeFaixas[+m[1]][m[2]]=num(t.value); else S.taxas[d.tx]=num(t.value);
    resultadosPreco(); clearTimeout(calcTimer); calcTimer=setTimeout(salvar, 3000);
  }
});
document.addEventListener("change",function(ev){
  var t=ev.target, d=t.dataset;
  if(t.id==="tipoReceita"){ S.tipoReceita=t.value; salvar(); render(); }
  if(t.id==="mesSel"){ mesSel=t.value||mesAtual(); render(); }
  if(d.pt){ S.plano.textos[d.pt]=t.value; salvar(); var q=t.closest(".pq"); if(q){ var okEl=q.querySelector(".ok"); var ok=t.value.trim().length>=10; if(ok&&!okEl){ q.querySelector(".q").insertAdjacentHTML("beforeend",'<span class="ok">✓</span>'); } if(!ok&&okEl) okEl.remove(); } var pn=nivelPlano(), en=document.getElementById("planoN"), eb=document.getElementById("planoBar"); if(en) en.textContent=pn+"/"+PERGUNTAS.length; if(eb) eb.style.width=Math.round(pn/PERGUNTAS.length*100)+"%"; }
  if(d.pn||d.mix||d.inv||d.cf||d.ci) salvar();
  if(d.cfg){ S[d.cfg] = d.cfg==="dasValor" ? num(t.value) : t.value; salvar(); render(); }
});

if(senha){ if(versao!==null){ logado=true; render(); } else telaLogin("",true); entrar(senha, true); }
else telaLogin("");
})();
